              "name": "Can a property be legally transferred via General Power of Attorney (GPA)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. The Supreme Court of India in Suraj Lamp & Industries (2011) unequivocally ruled that a General Power of Attorney (GPA), Agreement to Sell (ATS), or Will does not convey title or constitute a transfer of ownership in immovable property. Only a deed of conveyance or sale deed duly registered with the Sub-Registrar confers valid legal title."
              }

            {
              "@type": "Question",
              "name": "Can a builder demand more than 10% token advance before registration?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Under Section 13(1) of the Real Estate (Regulation and Development) Act 2016 (RERA), no promoter or developer can accept a sum exceeding 10 percent of the cost of the apartment, plot, or building as an advance payment or application fee without first executing and registering a written Agreement for Sale."
              }

              "@type": "Question",
              "name": "Are assured or guaranteed rental return schemes by developers legal?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Promising guaranteed 12-18% monthly rental returns prior to possession typically violates the Banning of Unregulated Deposit Schemes (BUDS) Act, 2019. In most instances, developers inflate the base capital cost to repay buyers with their own money, leading to defaults once market cycles turn."
              }
            },
            {
              "@type": "Question",
              "name": "What is the difference between Carpet Area and Super Built-Up Area under RERA?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Under Section 2(k) of RERA, Carpet Area means the net usable floor area of an apartment excluding the area covered by external walls, areas under service shafts, exclusive balcony or verandah area, and open terrace area. It strictly measures internal living space. Developers are legally prohibited from selling based on vague 'super built-up' percentages."
              }
